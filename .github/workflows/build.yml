name: Build Windows and macOS App

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: 3.38.5
  PYTHON_VERSION: '3.13'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Prepare fvp MDK SDK
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $plugins = Get-Content .flutter-plugins-dependencies | ConvertFrom-Json
          $fvp = $plugins.plugins.windows | Where-Object { $_.name -eq 'fvp' } | Select-Object -First 1
          if (-not $fvp) {
            throw 'fvp plugin was not found in .flutter-plugins-dependencies'
          }

          $fvpWindowsDir = Join-Path $fvp.path 'windows'
          $sdkDir = Join-Path $fvpWindowsDir 'mdk-sdk'
          $findMdk = Join-Path $sdkDir 'lib\cmake\FindMDK.cmake'
          if (Test-Path $findMdk) {
            Write-Host "fvp MDK SDK is already prepared at $sdkDir"
            exit 0
          }

          if (Test-Path $sdkDir) {
            Remove-Item $sdkDir -Recurse -Force
          }

          $archive = Join-Path $fvpWindowsDir 'mdk-sdk-windows-x64.7z'
          curl.exe --fail --location --output $archive `
            'https://sourceforge.net/projects/mdk-sdk/files/nightly/mdk-sdk-windows-x64.7z'

          Push-Location $fvpWindowsDir
          try {
            cmake -E tar xvf $archive
          } finally {
            Pop-Location
          }

          if (-not (Test-Path $findMdk)) {
            throw "Failed to prepare fvp MDK SDK at $sdkDir"
          }

      # macOS
      - name: Build macOS App
        if: matrix.os == 'macos-latest'
        run: |
          python build.py --build macos
          hdiutil create -format UDZO \
            -srcfolder build/macos/Build/Products/Release/XJI\ Media\ Toolbox.app \
            build/macos/Build/Products/Release/xji_media_toolbox_macos.dmg

      # Windows
      - name: Build Windows App
        if: matrix.os == 'windows-latest'
        run: flutter build windows --release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xji_media_toolbox_${{ matrix.os }}
          path: |
            build/macos/Build/Products/Release/*.dmg
            build/windows/x64/runner/Release/*
