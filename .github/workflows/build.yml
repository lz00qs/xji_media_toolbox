name: Build Windows and macOS App

on:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.47.2
  PYTHON_VERSION: '3.13'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Prepare fvp MDK SDK
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $plugins = Get-Content .flutter-plugins-dependencies | ConvertFrom-Json
          $fvp = $plugins.plugins.windows | Where-Object { $_.name -eq 'fvp' } | Select-Object -First 1
          if (-not $fvp) {
            throw 'fvp plugin was not found in .flutter-plugins-dependencies'
          }

          $fvpWindowsDir = Join-Path $fvp.path 'windows'
          $sdkDir = Join-Path $fvpWindowsDir 'mdk-sdk'
          $findMdk = Join-Path $sdkDir 'lib\cmake\FindMDK.cmake'
          if (Test-Path $findMdk) {
            Write-Host "fvp MDK SDK is already prepared at $sdkDir"
            exit 0
          }

          if (Test-Path $sdkDir) {
            Remove-Item $sdkDir -Recurse -Force
          }

          $archive = Join-Path $fvpWindowsDir 'mdk-sdk-windows-x64.7z'
          curl.exe --fail --location --output $archive `
            'https://sourceforge.net/projects/mdk-sdk/files/nightly/mdk-sdk-windows-x64.7z'

          Push-Location $fvpWindowsDir
          try {
            cmake -E tar xvf $archive
          } finally {
            Pop-Location
          }

          if (-not (Test-Path $findMdk)) {
            throw "Failed to prepare fvp MDK SDK at $sdkDir"
          }

      # macOS
      - name: Build macOS App
        if: matrix.os == 'macos-latest'
        run: |
          python build.py --build macos
          hdiutil create -format UDZO \
            -srcfolder build/macos/Build/Products/Release/XJI\ Media\ Toolbox.app \
            build/macos/Build/Products/Release/xji_media_toolbox_macos.dmg

      # Windows
      - name: Build Windows App
        if: matrix.os == 'windows-latest'
        run: python build.py --build windows

      - name: Verify Windows installer
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $installer = Get-ChildItem 'build\windows\installer' -Filter '*.exe' |
            Select-Object -First 1
          if (-not $installer) {
            throw 'The Windows installer was not generated.'
          }

          $installDir = Join-Path $env:RUNNER_TEMP 'xji-media-toolbox-installer-test'
          $installResult = Start-Process -FilePath $installer.FullName `
            -ArgumentList @(
              '/VERYSILENT',
              '/SUPPRESSMSGBOXES',
              '/NORESTART',
              '/NOICONS',
              "/DIR=`"$installDir`""
            ) `
            -Wait -PassThru
          if ($installResult.ExitCode -ne 0) {
            throw "Installer exited with code $($installResult.ExitCode)."
          }

          $installedFFmpeg = Join-Path $installDir 'ffmpeg\ffmpeg.exe'
          if (-not (Test-Path $installedFFmpeg)) {
            throw "Installed FFmpeg was not found at $installedFFmpeg"
          }
          & $installedFFmpeg -version
          if ($LASTEXITCODE -ne 0) {
            throw "Installed FFmpeg exited with code $LASTEXITCODE."
          }

          $uninstaller = Get-ChildItem $installDir -Filter 'unins*.exe' |
            Select-Object -First 1
          if (-not $uninstaller) {
            throw 'The generated uninstaller was not found.'
          }
          $uninstallResult = Start-Process -FilePath $uninstaller.FullName `
            -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') `
            -Wait -PassThru
          if ($uninstallResult.ExitCode -ne 0) {
            throw "Uninstaller exited with code $($uninstallResult.ExitCode)."
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: xji_media_toolbox_${{ matrix.os }}
          if-no-files-found: error
          path: |
            build/macos/Build/Products/Release/*.dmg
            build/windows/installer/*.exe
            build/windows/installer/*.sha256
